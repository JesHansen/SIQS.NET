name: build

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore SIQS.slnx
      - run: dotnet build SIQS.slnx -c Release --no-restore
      - run: dotnet test --solution SIQS.slnx -c Release --no-build
